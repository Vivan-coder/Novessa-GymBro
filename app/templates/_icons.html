{# Inline SVG icons: no emoji (they render differently per OS) and no extra requests. #}
{% macro ico(n, size=22) -%}
<svg class="ico {{ 'fill' if n in ('flame', 'bolt') }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if n == 'home' %}<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
{%- elif n == 'plus' %}<path d="M12 5v14M5 12h14"/>
{%- elif n == 'chart' %}<path d="M4 20V11M10 20V4M16 20v-7M22 20H2"/>
{%- elif n == 'users' %}<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2.2.7 3.5 2.6 3.5 5.7"/>
{%- elif n == 'flame' %}<path d="M12 2c.8 3.6 5 6 5 11a5 5 0 0 1-10 0c0-2 .9-3.4 2-4.5.1 1.8.9 3 2 3 0-3-1-6 1-9.5z"/>
{%- elif n == 'check' %}<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif n == 'trophy' %}<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 13v4M8 20h8M10 17h4"/>
{%- elif n == 'logout' %}<path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/>
{%- elif n == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
{%- elif n == 'timer' %}<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>
{%- endif %}
</svg>
{%- endmacro %}
